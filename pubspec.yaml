name: animebox
description: "AnimeBox — bibliothèque d'animés alimentée par Telegram, 100 % locale (étape 7 : Telegram direct via TDLib, analyse et catalogue sur l'appareil)."
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.2
  tdlib: ^1.6.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
