# Réglages par défaut pour une machine de développement standard
# (sur cette sandbox d'1,9 Go de RAM, la compilation APK complète n'a pas pu
# aboutir : elle nécessite un environnement avec davantage de mémoire).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
