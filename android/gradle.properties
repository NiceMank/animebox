# Réglages Gradle — compatibles avec une machine modeste ET un futur
# workflow GitHub Actions (ubuntu-latest, 7 Go de RAM).
# Bornes mémoire : largement suffisantes pour un runner CI standard
# (ubuntu-latest, 7 Go) — R8 en mode release a besoin de souffle.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
