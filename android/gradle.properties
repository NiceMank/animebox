# Réglages Gradle — compatibles avec une machine modeste ET un futur
# workflow GitHub Actions (ubuntu-latest, 7 Go de RAM).
# Bornes mémoire volontairement basses : sur la sandbox (~2 Go), elles
# permettent à la compilation APK d'aboutir ; sur une CI standard, elles
# restent largement suffisantes.
org.gradle.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=320m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
