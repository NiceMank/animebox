name: Release

# Publication d'une release :
# - push d'un tag v* (ex. v0.9.0) ;
# - ou déclenchement manuel (crée/met à jour le tag de version).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version Flutter
        run: flutter --version

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique + tests
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-pub
          flutter test

      - name: Extraire la version (pubspec.yaml)
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION (tag v$VERSION)"

      - name: Build APK (release, clés debug)
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -o pipefail
          # Identifiants d'application Telegram (my.telegram.org) injectés
          # par GitHub Secrets : l'APK embarque le client MTProto réel (TDLib).
          # Secrets absents → valeurs vides → démonstration (aucun réseau).
          flutter build apk --release \
            --dart-define=ANIMEBOX_TELEGRAM_API_ID=${TELEGRAM_API_ID} \
            --dart-define=ANIMEBOX_TELEGRAM_API_HASH=${TELEGRAM_API_HASH} \
            2>&1 | tee /tmp/build.log

      - name: Diagnostic du build
        if: failure()
        shell: bash
        run: |
          { awk '/What went wrong:/{f=1} f{print} /^\* Try:/{exit}' /tmp/build.log | head -30
            grep -E 'error:|Error:' /tmp/build.log | head -10 ; } | cut -c1-380 > /tmp/issues.log || true
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [ $n -ge 10 ] && break
            MSG=$(echo "$line" | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=animebox-build::$MSG"
            n=$((n+1))
          done < /tmp/issues.log

      - name: Préparer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "AnimeBox-v${{ steps.version.outputs.version }}.apk"

      # Relance manuelle : repartir d'une release propre pour ce tag.
      - name: Supprimer une release précédente du même tag (relance manuelle)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag || true

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AnimeBox v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: AnimeBox-v*.apk
          make_latest: true
          generate_release_notes: true
          body: |
            **AnimeBox v${{ steps.version.outputs.version }}** — APK Android signé avec les clés de
            débogage (installation directe : activer « Installer des applications
            inconnues », puis ouvrir l'APK).

            ## Contenu
            - Application Flutter Android, 100 % locale (aucun serveur distant).
            - Client **Telegram réel** (TDLib / MTProto) embarqué lorsque les
              secrets de compilation sont présents.
            - Logo + écran d'accueil animé, onboarding, thème bleu sombre/clair,
              bibliothèque, sources Telegram, synchronisation locale, paramètres.

            ## Vérifications
            - `flutter analyze` — 0 issue
            - `flutter test` — suite complète
            - APK release construit

            Commit : ${{ github.sha }}
            Branch : `${{ github.ref_name }}`
