name: CI

# Intégration continue — toutes les branches (et PR), pas les tags.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter — analyse + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version Flutter
        run: flutter --version

      - name: Dépendances
        run: flutter pub get

      # En cas d'échec : log émis en annotations (lisible via l'API même
      # quand les fichiers de logs bruts sont inaccessibles depuis le
      # sandbox de développement).
      - name: Analyse statique (0 issue attendu)
        shell: bash
        run: flutter analyze --no-pub

      - name: Diagnostic des issues analyze
        if: failure()
        shell: bash
        run: |
          flutter analyze --no-pub 2>&1 | grep -E '(error|warning|info) .' | cut -c1-380 > /tmp/issues.log || true
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [ $n -ge 10 ] && break
            MSG=$(echo "$line" | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=animebox-analyze::$MSG"
            n=$((n+1))
          done < /tmp/issues.log

      - name: Tests Flutter
        shell: bash
        run: flutter test

  android:
    name: Android — build APK (artefact de test)
    needs: [flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      # Signé avec les clés de débogage (voir build.gradle.kts) :
      # installable directement pour tester.
      - name: Build APK (release, clés debug)
        shell: bash
        env:
          ANIMEBOX_TELEGRAM_API_ID: ${{ secrets.ANIMEBOX_TELEGRAM_API_ID }}
          ANIMEBOX_TELEGRAM_API_HASH: ${{ secrets.ANIMEBOX_TELEGRAM_API_HASH }}
        run: |
          set -o pipefail
          # Identifiants d'application Telegram (my.telegram.org) injectés
          # par secrets : l'APK embarque le client MTProto réel (TDLib).
          # Secrets absents → valeurs vides → démonstration (aucun réseau).
          flutter build apk --release \
            --dart-define=ANIMEBOX_TELEGRAM_API_ID=${ANIMEBOX_TELEGRAM_API_ID} \
            --dart-define=ANIMEBOX_TELEGRAM_API_HASH=${ANIMEBOX_TELEGRAM_API_HASH} \
            2>&1 | tee /tmp/build.log

      - name: Diagnostic du build
        if: failure()
        shell: bash
        run: |
          { awk '/What went wrong:/{f=1} f{print} /^\* Try:/{exit}' /tmp/build.log | head -30
            grep -E 'error:|Error:' /tmp/build.log | head -10 ; } | cut -c1-380 > /tmp/issues.log || true
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [ $n -ge 10 ] && break
            MSG=$(echo "$line" | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=animebox-build::$MSG"
            n=$((n+1))
          done < /tmp/issues.log

      - name: Publier l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeBox-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
